{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block head_title %}
                Log In
                {% endblock head_title %}
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href="{% static 'myapp/css/styles.css' %}" rel="stylesheet">
    </head>

    <body class="bg-body-tertiary">
        <div class="container d-flex justify-content-center align-items-center min-vh-100">
            <div class="card shadow-sm p-4 w-100" style="max-width: 24rem;">
                <h1 class="h3 text-center mb-4" id="form-title">Log in</h1>

                <!-- If there is an error, display it in a bootstrap alert -->
                {% if error %}
                <div class="alert alert-danger" role="alert">{{ error }}</div>
                {% endif %}

                <!-- Log in form-->
                <form method="post" id="login-form">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Log in</button>
                </form>

                <!-- Sign up Form (hidden by default)-->
                <form method="post" action="{% url 'signup' %}" id="signup-form" class="d-none">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="signup-username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="signup-username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="signup-email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="signup-email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="signup-password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="signup-password" name="password">
                    </div>

                    <button type="submit" class="btn btn-success w-100">Sign Up</button>
                    
                </form>
                <button type="button" class="btn btn-outline-secondary w-100" id="toggle-btn">Don't have an account? Sign Up</button>

            </div>
        </div>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script>
            const loginForm = document.getElementById("login-form");
            const signupForm = document.getElementById("signup-form");
            const title = document.getElementById("form-title");
            const toggleBtn = document.getElementById("toggle-btn");

            toggleBtn.addEventListener("click", () => {
                const showingLogin = !loginForm.classList.contains("d-none");

                loginForm.classList.toggle("d-none", showingLogin);
                signupForm.classList.toggle("d-none", !showingLogin);

                title.textContent = showingLogin ? "Sign up" : "Log in";
                toggleBtn.textContent = showingLogin ? "Back to log in" : "Don't have an account? Sign Up";
            });
        </script>
    </body>
</html>
